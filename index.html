<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Demonstração de login do projeto acadêmico iTDesigns.">
  <link rel="icon" href="./img/1.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <title>Entrar | iTDesigns</title>
</head>
<body>
  <main class="login-page">
    <div class="container">
      <div class="row min-vh-100 align-items-center justify-content-center justify-content-lg-start py-5">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
          <section class="login-card shadow-lg" aria-labelledby="login-title">
            <img src="./img/1.png" class="login-logo mb-3" alt="iTDesigns">
            <h1 id="login-title" class="h3 mb-2">Acessar demonstração</h1>
            <p class="text-secondary small mb-4">Login demonstrativo do projeto acadêmico. Use <strong>usuario</strong> e <strong>senha</strong>.</p>
            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label for="username" class="form-label">Usuário</label>
                <input type="text" id="username" class="form-control" autocomplete="username" required>
                <div class="invalid-feedback">Informe o usuário.</div>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Senha</label>
                <input type="password" id="password" class="form-control" autocomplete="current-password" required>
                <div class="invalid-feedback">Informe a senha.</div>
              </div>
              <button type="submit" class="btn btn-dark w-100">Entrar</button>
              <p id="error-message" class="login-feedback mt-3 mb-0" role="alert" aria-live="polite"></p>
            </form>
          </section>
        </div>
      </div>
    </div>
  </main>
  <script src="./script.js"></script>
</body>
</html>
